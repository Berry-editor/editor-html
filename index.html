<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BerryEditor - 一个基于TurboWarp的现代化Scratch编辑器" />
  <meta name="theme-color" content="#6c5ce7" />
  <title>BerryEditor</title>
  <style>
    /* ========== 色彩系统 ========== */
    :root {
      --primary-gradient: linear-gradient(135deg, #ff7eb3, #ff758c, #f5b8ea);
      --secondary-gradient: linear-gradient(135deg, #6c5ce7, #a29bfe);
      --bg-gradient: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
      --text-primary: #fff;
      --text-secondary: #aab;
      --text-muted: #778;
      --shadow-primary: rgba(108, 92, 231, 0.4);
      --shadow-secondary: rgba(108, 92, 231, 0.6);
    }

    /* ========== 基础样式 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      color: var(--text-primary);
      overflow-x: hidden;
      position: relative;
    }

    /* ========== 装饰性背景元素 ========== */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 600px;
      height: 600px;
      background: var(--primary-gradient);
      top: -200px;
      right: -100px;
      animation: float 15s ease-in-out infinite;
    }

    body::after {
      width: 500px;
      height: 500px;
      background: var(--secondary-gradient);
      bottom: -150px;
      left: -100px;
      animation: float 18s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* ========== 容器布局 ========== */
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ========== 标题样式 ========== */
    h1 {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
      margin-bottom: 1rem;
      line-height: 1.1;
      animation: titleFadeIn 0.8s ease-out;
    }

    @keyframes titleFadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: var(--text-secondary);
      margin-bottom: 3rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      animation: subtitleFadeIn 0.8s ease-out 0.2s both;
    }

    @keyframes subtitleFadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== 按钮容器 ========== */
    .button-group {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
      animation: buttonsFadeIn 0.8s ease-out 0.4s both;
    }

    @keyframes buttonsFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== 按钮样式 ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1rem 2.5rem;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 600;
      color: var(--text-primary);
      background: var(--secondary-gradient);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 30px var(--shadow-primary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      will-change: transform;
      min-width: 200px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 40px var(--shadow-secondary);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.5), 0 12px 40px var(--shadow-secondary);
    }

    /* 按钮图标 */
    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ========== 状态提示 ========== */
    .status {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      animation: statusFadeIn 0.8s ease-out 0.6s both;
    }

    @keyframes statusFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .status.success {
      color: #4cd964;
    }

    .status.error {
      color: #ff6b6b;
    }

    /* 加载动画 */
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--text-primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== 响应式设计 ========== */
    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }

      h1 {
        font-size: clamp(2.5rem, 12vw, 3.5rem);
        letter-spacing: -1px;
      }

      .subtitle {
        margin-bottom: 2rem;
      }

      .button-group {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .btn {
        width: 100%;
        max-width: 300px;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .btn {
        padding: 0.9rem 2rem;
        min-width: 180px;
      }
    }

    /* ========== 性能优化 ========== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== 无障碍优化 ========== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BerryEditor</h1>
    <p class="subtitle">一个基于TurboWarp的Scratch编辑器</p>
    
    <div class="button-group">
      <a href="./editor/index.html" class="btn" aria-label="在线体验网页版编辑器">
        <!-- 在线体验图标 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
        <span>在线体验</span>
      </a>
      
      <a href="https://github.com/berry-editor/" class="btn" target="_blank" rel="noopener noreferrer" aria-label="在GitHub上查看项目（在新窗口打开）">
        <!-- GitHub图标 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
    
    <div class="status" id="statusMsg" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span class="sr-only"></span>
    </div>
  </div>

  <script>
    // 页面加载后检查 /editor 是否可达（只做状态提示，不影响按钮跳转）
    (function() {
      var statusElement = document.getElementById('statusMsg');
      
      fetch('/editor', { method: 'HEAD', cache: 'no-store' })
        .then(function(r) {
          if (r.ok) {
            statusElement.className = 'status success';
            statusElement.innerHTML = '<span></span>';
          } else {
            statusElement.className = 'status error';
            statusElement.innerHTML = '<span></span>';
          }
        })
        .catch(function() {
          statusElement.className = 'status error';
          statusElement.innerHTML = '<span></span>';
        });
    })();
  </script>
</body>
</html>
